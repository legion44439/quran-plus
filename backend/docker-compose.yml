services:
  postgres:
    image: postgres:16-alpine
    container_name: quran-plus-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran_secret
      POSTGRES_DB: quran_plus
    volumes:
      - quran_plus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran_plus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quran_plus_pgdata:
